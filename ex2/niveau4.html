<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <p id="info"></p>
        <div class="btns">
            <button class="btn">vert</button>
            <button class="btn">bleu</button>
            <button class="btn">rouge</button>
        </div>
    </main>
    <style>
        .btn{
            background-color: blue;
            color: white;
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
        }
    </style>
    <script>
        const message = document.getElementById("info");
        const bouttons = document.querySelectorAll(".btn");
        bouttons.forEach(function(button){
            button.addEventListener("mouseenter", function(event){
                message.textContent = "Vous survolez la couleur "+ event.target.textContent ;
            });
        })
    </script>
</body>
</html>
