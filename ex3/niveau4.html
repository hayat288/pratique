<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h2>Mon article</h2>
        <p>Basculez le thème avec le bouton ci-dessous.</p>
        <button id="theme-btn">Dark Mode</button>
    </main>
    <style>
        #theme-btn{
            background-color: blue;
            color: white;
            padding: 10px;
            border-radius: 10px;
        }
        body { transition: background 0.2s, color 0.2s; }
        body.dark-theme { background: #0f172a; color: #f8fafc; }
    </style>
    <script>
        const boutton = document.getElementById("theme-btn")
        boutton.addEventListener("click" , function(){
            if(document.body.classList.contains("dark-theme")){
                document.body.classList.remove("dark-theme")
            }else{
                document.body.classList.add("dark-theme")
            }
        })
    </script>
</body>
</html>
