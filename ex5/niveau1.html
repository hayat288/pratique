<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <main>
    <div class="row">
      <input type="text" id="name-input" placeholder="Écrivez quelque chose">
      <button id="validate-btn">Valider</button>
    </div>
    <h3 id="output"></h3>
   </main> 
   <style>
    .row>input{
        padding: 10px;
        border-radius: 10px;
    }
    #validate-btn{
        background-color: blue;
        color: white;
        padding: 10px;
        border-radius: 10px;
    }
   </style>
   <script>
    const champ = document.getElementById("name-input")
    const validation = document.getElementById("validate-btn")
    const resultat = document.getElementById("output")
    validation.addEventListener("click" , function(){
        resultat.textContent = champ.value
    })
   </script>
</body>
</html>
