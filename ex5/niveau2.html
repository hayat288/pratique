<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <input type="text" id="live-input" placeholder="Tapez en direct">
        <p>Aperçu : <strong id="live-output"></strong></p>
    </main>
    <script>
        const texte = document.getElementById("live-input")
        const resultat = document.getElementById("live-output")
        texte.addEventListener("input" , function(){
            resultat.textContent = texte.value
        })
    </script>
</body>
</html>
